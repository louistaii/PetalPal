<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Petal Pal</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🪴</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --mint: #e6f2e3;
    --paper: #fbfdf9;
    --leaf: #1f4d3a;
    --leaf-soft: #4f8a6b;
    --butter: #ffd966;
    --sky: #8fcdf2;
    --blush: #f6a9b8;
    --clay: #c98b5e;
    --ink: #20342b;
    --muted: #5f7a6c;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --mint: #14241c;
      --paper: #1c3126;
      --leaf: #bfe8cf;
      --leaf-soft: #7fc29c;
      --ink: #e8f4ec;
      --muted: #94b3a2;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--mint); color: var(--ink);
    font-family: 'Nunito', system-ui, sans-serif; line-height: 1.5;
  }
  h1, h2, .num { font-family: 'Fredoka', 'Nunito', sans-serif; }
  main { max-width: 960px; margin: 0 auto; padding: 24px 18px 56px; }
  header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  h1 { margin: 0; font-size: 1.6rem; color: var(--leaf); font-weight: 600; }
  #seen { color: var(--muted); font-size: .95rem; }

  /* Hero: the plant's mood */
  .hero {
    display: grid; grid-template-columns: 220px 1fr; gap: 28px; align-items: center;
    background: var(--paper); border-radius: 36px; padding: 28px; margin: 20px 0;
  }
  .pot { width: 100%; max-width: 220px; justify-self: center; }
  .mood-line { font-family: 'Fredoka'; font-size: 2rem; margin: 0 0 6px; color: var(--leaf); font-weight: 500; }
  .mood-sub { margin: 0; color: var(--muted); font-size: 1.05rem; max-width: 42ch; }
  .sprout { transform-origin: 100px 118px; animation: sway 4s ease-in-out infinite; }
  @keyframes sway { 50% { transform: rotate(3deg); } }
  @media (prefers-reduced-motion: reduce) { .sprout { animation: none; } }

  .grid { display: grid; grid-template-columns: 1.1fr 1fr; gap: 20px; }
  .photo {
    background: var(--paper); border-radius: 28px; padding: 12px; overflow: hidden;
  }
  .photo img { width: 100%; display: block; border-radius: 18px; aspect-ratio: 4/3; object-fit: cover; background: var(--mint); }
  .photo p { margin: 8px 6px 2px; color: var(--muted); font-size: .9rem; }

  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .stat { border-radius: 22px; padding: 14px 16px; color: #20342b; }
  .stat .num { font-size: 2rem; font-weight: 500; line-height: 1.1; }
  .stat .lbl { font-weight: 700; font-size: .95rem; }
  .stat svg { width: 100%; height: 34px; margin-top: 6px; }
  .temp { background: var(--blush); } .hum { background: var(--sky); }
  .soil { background: #d6b08c; } .light { background: var(--butter); }

  .empty { text-align: center; padding: 40px 16px; color: var(--muted); }
  code { background: var(--paper); padding: 2px 6px; border-radius: 6px; }

  @media (max-width: 720px) {
    .hero { grid-template-columns: 1fr; text-align: center; padding: 22px; }
    .mood-sub { margin: 0 auto; }
    .grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<main>
  <header>
    <h1>Petal Pal</h1>
    <span id="seen" aria-live="polite">Waiting for a first reading…</span>
  </header>

  <section class="hero" aria-label="Plant mood">
    <svg class="pot" viewBox="0 0 200 200" role="img" aria-label="Plant in a pot with a face">
      <g class="sprout">
        <path d="M100 118 C100 90 100 70 100 52" stroke="#4f8a6b" stroke-width="7" fill="none" stroke-linecap="round"/>
        <path id="leafL" d="M100 78 C70 78 52 62 50 40 C76 38 98 52 100 78Z" fill="#6fb88a"/>
        <path id="leafR" d="M100 64 C128 64 146 48 148 28 C122 26 102 40 100 64Z" fill="#8fd1a4"/>
      </g>
      <path d="M52 118 H148 L138 184 Q137 190 130 190 H70 Q63 190 62 184Z" fill="#c98b5e"/>
      <rect x="46" y="108" width="108" height="20" rx="10" fill="#d9a074"/>
      <g id="face" transform="translate(0,2)"></g>
    </svg>
    <div>
      <p class="mood-line" id="moodLine">Hello!</p>
      <p class="mood-sub" id="moodSub">Once your ESP32 sends a reading, I'll tell you how I'm feeling.</p>
    </div>
  </section>

  <div id="content" hidden>
    <div class="grid">
      <figure class="photo" style="margin:0">
        <img id="photo" alt="Latest photo of the plant">
        <p id="photoTime"></p>
      </figure>
      <div class="stats">
        <div class="stat temp"><div class="lbl">Temperature</div><div class="num" id="t">–</div><svg id="s-temp" viewBox="0 0 100 34" preserveAspectRatio="none"></svg></div>
        <div class="stat hum"><div class="lbl">Humidity</div><div class="num" id="h">–</div><svg id="s-hum" viewBox="0 0 100 34" preserveAspectRatio="none"></svg></div>
        <div class="stat soil"><div class="lbl">Soil moisture</div><div class="num" id="m">–</div><svg id="s-soil" viewBox="0 0 100 34" preserveAspectRatio="none"></svg></div>
        <div class="stat light"><div class="lbl">Light</div><div class="num" id="l">–</div><svg id="s-light" viewBox="0 0 100 34" preserveAspectRatio="none"></svg></div>
      </div>
    </div>
  </div>
</main>

<script>
const $ = (id) => document.getElementById(id);
const fmt = (v, unit, d = 1) => (v === null || v === undefined ? '–' : `${Number(v).toFixed(d).replace(/\.0+$/, '')}${unit}`);

const faces = {
  happy: `<circle cx="84" cy="150" r="5" fill="#20342b"/><circle cx="116" cy="150" r="5" fill="#20342b"/>
          <path d="M88 162 Q100 174 112 162" stroke="#20342b" stroke-width="4" fill="none" stroke-linecap="round"/>
          <circle cx="74" cy="162" r="6" fill="#f6a9b8" opacity=".8"/><circle cx="126" cy="162" r="6" fill="#f6a9b8" opacity=".8"/>`,
  thirsty: `<path d="M78 150 Q84 144 90 150" stroke="#20342b" stroke-width="4" fill="none" stroke-linecap="round"/>
            <path d="M110 150 Q116 144 122 150" stroke="#20342b" stroke-width="4" fill="none" stroke-linecap="round"/>
            <path d="M90 168 Q100 160 110 168" stroke="#20342b" stroke-width="4" fill="none" stroke-linecap="round"/>
            <path d="M138 142 q5 8 0 12 q-5 -4 0 -12z" fill="#8fcdf2"/>`,
  sleepy: `<path d="M78 152 H90 M110 152 H122" stroke="#20342b" stroke-width="4" stroke-linecap="round"/>
           <ellipse cx="100" cy="168" rx="5" ry="4" fill="#20342b"/>
           <text x="132" y="140" font-family="Fredoka" font-size="16" fill="#20342b">z</text>`,
  uneasy: `<circle cx="84" cy="150" r="5" fill="#20342b"/><circle cx="116" cy="150" r="5" fill="#20342b"/>
           <path d="M88 168 Q94 162 100 168 Q106 174 112 168" stroke="#20342b" stroke-width="4" fill="none" stroke-linecap="round"/>
           <path d="M136 140 q4 6 0 9" stroke="#8fcdf2" stroke-width="4" fill="none" stroke-linecap="round"/>`,
};

function mood(r) {
  if (r.soil_moisture !== null && r.soil_moisture < 25)
    return ['thirsty', "I'm thirsty!", 'My soil is getting dry. A little water would be lovely.'];
  if (r.temperature !== null && (r.temperature > 33 || r.temperature < 10))
    return ['uneasy', r.temperature > 33 ? "It's toasty in here" : "Brr, chilly", `It's ${fmt(r.temperature, '°C')} around me. Somewhere a bit milder would help.`];
  if (r.light !== null && r.light < 50 && new Date(r.ts).getHours() >= 7 && new Date(r.ts).getHours() < 19)
    return ['sleepy', "It's a bit dim", "I'm not getting much light. Maybe a sunnier spot?"];
  return ['happy', "I'm doing great!", 'Soil, light and air all look good. Thanks for looking after me.'];
}

function spark(id, values) {
  const el = $(id);
  const v = values.filter((x) => x !== null && x !== undefined).reverse(); // oldest → newest
  if (v.length < 2) { el.innerHTML = ''; return; }
  const min = Math.min(...v), max = Math.max(...v), range = max - min || 1;
  const pts = v.map((x, i) => `${(i / (v.length - 1)) * 100},${30 - ((x - min) / range) * 26}`).join(' ');
  el.innerHTML = `<polyline points="${pts}" fill="none" stroke="#20342b" stroke-opacity=".6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>`;
}

function ago(ts) {
  const s = Math.max(0, (Date.now() - ts) / 1000);
  if (s < 90) return 'just now';
  if (s < 3600) return `${Math.round(s / 60)} min ago`;
  if (s < 86400) return `${Math.round(s / 3600)} h ago`;
  return `${Math.round(s / 86400)} d ago`;
}

async function load() {
  try {
    const res = await fetch('/api/readings?limit=48', { cache: 'no-store' });
    const data = await res.json();
    if (!Array.isArray(data) || !data.length) {
      $('face').innerHTML = faces.sleepy; return;
    }
    const r = data[0];
    const [m, line, sub] = mood(r);
    $('face').innerHTML = faces[m];
    $('moodLine').textContent = line;
    $('moodSub').textContent = sub;
    $('seen').textContent = `Last update ${ago(r.ts)}`;

    $('t').textContent = fmt(r.temperature, '°C');
    $('h').textContent = fmt(r.humidity, '%', 0);
    $('m').textContent = fmt(r.soil_moisture, '%', 0);
    $('l').textContent = fmt(r.light, ' lx', 0);
    spark('s-temp', data.map((d) => d.temperature));
    spark('s-hum', data.map((d) => d.humidity));
    spark('s-soil', data.map((d) => d.soil_moisture));
    spark('s-light', data.map((d) => d.light));

    const withImg = data.find((d) => d.image);
    if (withImg) {
      $('photo').src = withImg.image;
      $('photoTime').textContent = `Photo taken ${ago(withImg.ts)}`;
    } else {
      $('photoTime').textContent = 'No photo received yet.';
    }
    $('content').hidden = false;
  } catch (e) {
    $('seen').textContent = "Couldn't reach the server. Retrying soon.";
  }
}
load();
setInterval(load, 30000);
</script>
</body>
</html>
